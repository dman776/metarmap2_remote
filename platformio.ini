; METARMap Remote firmware for the LCDwiki ES3C28P
; (ESP32-S3 N16R8, 2.8" ILI9341V 240x320 SPI LCD, FT6336G capacitive touch).
;
;   pio run                 build
;   pio run -t upload       flash over the USB-C port
;   pio device monitor      serial console

[platformio]
default_envs = es3c28p

[env:es3c28p]
platform = espressif32@6.9.0
framework = arduino
; No ES3C28P board definition exists; the DevKitC-1 is the same S3 with
; the flash and PSRAM sizes overridden below.
board = esp32-s3-devkitc-1

; 16 MB QIO flash, 8 MB octal (OPI) PSRAM.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; The USB-C port is the S3's native USB-Serial/JTAG, so Serial goes there.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    lovyan03/LovyanGFX@1.2.7
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
