; MetarMap2 Remote firmware for the LCDwiki ES3C28P
; (ESP32-S3 N16R8, 2.8" ILI9341V 240x320 SPI LCD, FT6336G capacitive touch).
;
;   pio run                 build
;   pio run -t upload       flash over the USB-C port
;   pio device monitor      serial console
;   pio test -e native      unit tests, on this computer
;   pio check               static analysis (cppcheck)

[platformio]
default_envs = es3c28p

[env:es3c28p]
platform = espressif32@6.9.0
framework = arduino
; No ES3C28P board definition exists; the DevKitC-1 is the same S3 with
; the flash and PSRAM sizes overridden below.
board = esp32-s3-devkitc-1

; 16 MB QIO flash, 8 MB octal (OPI) PSRAM.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L

; The USB-C port is the S3's native USB-Serial/JTAG, so Serial goes there.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; Writes include/firmware_version.h from git describe, for the splash screen.
extra_scripts = pre:tools/version.py

lib_deps =
    lovyan03/LovyanGFX@1.2.7
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; pio check: cppcheck on our code only, not the libraries or the generated images.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = +<src/> -<src/logo.c> -<src/star_icon.c> +<include/>
check_flags =
    cppcheck: --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=*:*/.pio/*

; Unit tests on this computer (pio test -e native) for the code that doesn't
; need the board: parsing the map's JSON and matching the legend.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<legend.cpp> +<map_parse.cpp> +<update_check.cpp>
build_flags = -std=c++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson@7.2.1
