name: ci

# Not for a push or pull request that changes only the README and docs/.
on:
  push:
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
    paths-ignore: ["README.md", "docs/**"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: pre-commit (clang-format, ruff)
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Unit tests
        run: pio test -e native
      - name: Static analysis
        run: pio check -e es3c28p --fail-on-defect=low
      - name: Build (no secrets.h, like the published firmware)
        run: pio run -e es3c28p
